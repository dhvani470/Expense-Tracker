
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense | Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 650px;">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h2 class="mb-4">Edit Expense</h2>

                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">
                        {{ message }}
                    </div>
                {% endfor %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="amount" class="form-label">Amount (₹)</label>
                        <input type="number" id="amount" name="amount"
                               class="form-control" min="0.01" step="0.01"
                               value="{{ expense.amount }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select id="category" name="category"
                                class="form-select" required>
                            {% for category in categories %}
                                <option value="{{ category.id }}"
                                    {% if category.id == expense.category_id %}selected{% endif %}>
                                    {{ category.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" id="date" name="date"
                               class="form-control"
                               value="{{ expense.date|date:'Y-m-d' }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" id="description" name="description"
                               class="form-control" maxlength="255"
                               value="{{ expense.description }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="payment_method" class="form-label">Payment Method</label>
                        <select id="payment_method" name="payment_method"
                                class="form-select" required>
                            {% for value, label in expense.PAYMENT_METHODS %}
                                <option value="{{ value }}"
                                    {% if value == expense.payment_method %}selected{% endif %}>
                                    {{ label }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>
                    <a href="{% url 'dashboard' %}"
                       class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
