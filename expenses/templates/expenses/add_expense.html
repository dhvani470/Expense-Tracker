{% extends 'expenses/base.html' %}

{% block title %}Add Expense | Expense Tracker{% endblock %}

{% block content %}
<div class="add-expense-page">
    <div class="add-expense-card card">
        <div class="card-body">
            <div class="mb-4">
                <h1 class="h2 mb-2">Add New Expense</h1>
                <p class="text-muted mb-0">Record a purchase or payment.</p>
            </div>

            <form method="post" id="addExpenseForm" novalidate>
                {% csrf_token %}

                <div class="mb-3">
                    <label for="amount" class="form-label">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        class="form-control"
                        min="0.01"
                        step="0.01"
                        placeholder="Enter amount"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select
                        id="category"
                        name="category"
                        class="form-select"
                        required
                    >
                        <option value="">Choose a category</option>
                        {% for category in categories %}
                            <option value="{{ category.id }}">
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        class="form-control"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">
                        Description
                    </label>
                    <input
                        type="text"
                        id="description"
                        name="description"
                        class="form-control"
                        maxlength="255"
                        placeholder="e.g. Lunch, groceries"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="payment_method" class="form-label">
                        Payment Method
                    </label>
                    <select
                        id="payment_method"
                        name="payment_method"
                        class="form-select"
                        required
                    >
                        <option value="">Choose a payment method</option>
                        <option value="Cash">Cash</option>
                        <option value="UPI">UPI</option>
                        <option value="Card">Card</option>
                        <option value="Bank Transfer">Bank Transfer</option>
                    </select>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a
                        href="{% url 'dashboard' %}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Save Expense
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
